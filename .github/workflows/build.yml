name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev automake build-essential ant
          pip install --upgrade pip
          pip install buildozer Cython==0.29.33
      - name: Accept Android Licenses
        run: |
          # Aceptar todas las licencias de Android
          mkdir -p $HOME/.android
          mkdir -p $ANDROID_SDK_ROOT/licenses || mkdir -p /usr/local/lib/android/sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license 2>/dev/null || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license 2>/dev/null || true
          echo "24333f8a63b6825ea9c5514f83c1059b8ea3b2e" >> $ANDROID_HOME/licenses/android-sdk-license 2>/dev/null || true
          # Para el SDK de ubuntu-22.04
          sudo mkdir -p /usr/local/lib/android/sdk/licenses
          sudo bash -c 'echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > /usr/local/lib/android/sdk/licenses/android-sdk-license'
          sudo bash -c 'echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> /usr/local/lib/android/sdk/licenses/android-sdk-license'
          sudo bash -c 'echo "24333f8a63b6825ea9c5514f83c1059b8ea3b2e" >> /usr/local/lib/android/sdk/licenses/android-sdk-license'
          yes | sdkmanager --licenses || true
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Build APK
        run: |
          buildozer android debug --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VisorLuz-APK
          path: bin/*.apk
