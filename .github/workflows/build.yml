name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          sudo apt update -qq
          sudo apt install -y python3-pip zip unzip libssl-dev libffi-dev libltdl-dev libsqlite3-dev libbz2-dev
          pip install --upgrade pip
          pip install buildozer cython
      - name: Build
        run: |
          yes | buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VisorLuz-APK
          path: bin/*.apk
