name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install P4A
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev automake build-essential
          pip install --upgrade pip
          pip install python-for-android Cython==0.29.33 kivy==2.3.0
      - name: Build APK with P4A
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          p4a apk --private . --package=com.goliatelfo.visorluz --name VisorLuz --version 9.9 --bootstrap=sdl2 --requirements=python3,kivy --arch arm64-v8a --permission INTERNET --permission CAMERA --allow-collisions --dist-name VisorLuz --no-use-setup-py
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VisorLuz-APK
          path: "*.apk"
