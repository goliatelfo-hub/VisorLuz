name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev automake build-essential libsqlite3-dev
          pip install --upgrade pip
          pip install python-for-android==2024.1.21 Cython==0.29.33
      - name: Install Android SDK + NDK 25
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
      - name: Build APK
        run: |
          p4a apk --private . --package=com.goliatelfo.visorluz --name VisorLuz --version 11.0 --bootstrap=sdl2 --requirements=python3,kivy --arch arm64-v8a --permission INTERNET --permission CAMERA --permission WRITE_EXTERNAL_STORAGE --dist-name VisorLuz
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VisorLuz-APK
          path: "*.apk"
